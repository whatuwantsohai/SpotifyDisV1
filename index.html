<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>SpotifyDis</title>

  <!-- INTER FONT -->
  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  >

  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  >

  <style>

    /* =====================================================
       GLOBAL
    ===================================================== */

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
    }

    body {
      font-family:
        "Inter",
        "SF Pro Display",
        "Helvetica Neue",
        Arial,
        sans-serif;

      background: #080808;
      color: white;

      overflow: hidden;
    }

    button,
    input {
      font: inherit;
    }


    /* =====================================================
       CONNECT SCREEN
    ===================================================== */

    #connectScreen {
      position: fixed;

      inset: 0;

      background:
        radial-gradient(
          circle at center,
          #171717 0%,
          #080808 65%
        );

      display: flex;

      align-items: center;
      justify-content: center;

      z-index: 99999;

      padding:
        max(20px, env(safe-area-inset-top))
        max(20px, env(safe-area-inset-right))
        max(20px, env(safe-area-inset-bottom))
        max(20px, env(safe-area-inset-left));
    }


    #connectBox {
      width: min(90%, 420px);

      text-align: center;

      padding: 40px 30px;

      border-radius: 26px;

      background:
        rgba(22, 22, 22, 0.95);

      border:
        1px solid rgba(255,255,255,0.08);

      box-shadow:
        0 30px 100px rgba(0,0,0,0.7);

      backdrop-filter: blur(20px);

      position: relative;

      z-index: 100;
    }


    #connectLogo {
      width: 68px;
      height: 68px;

      margin:
        0 auto 18px;

      border-radius: 50%;

      background: #1ed760;

      display: flex;

      align-items: center;
      justify-content: center;

      color: black;

      font-size: 30px;

      font-weight: 900;
    }


    #connectBox h1 {
      font-size: 42px;

      margin-bottom: 10px;

      letter-spacing: -2px;
    }


    #connectBox p {
      color: #aaa;

      margin-bottom: 28px;

      line-height: 1.5;

      font-size: 15px;
    }


    #connectButton {
      width: 100%;

      min-height: 56px;

      border: none;

      border-radius: 999px;

      background: #1ed760;

      color: #000;

      font-size: 16px;

      font-weight: 800;

      cursor: pointer;

      position: relative;

      z-index: 102;

      box-shadow:
        0 10px 35px rgba(30,215,96,0.22);

      transition:
        transform 0.15s ease,
        background 0.15s ease,
        box-shadow 0.15s ease;
    }


    #connectButton:hover {
      background: #1fdf64;

      transform: translateY(-2px);

      box-shadow:
        0 15px 45px rgba(30,215,96,0.35);
    }


    #connectButton:active {
      transform: scale(0.98);
    }


    /* =====================================================
       MAIN APP
    ===================================================== */

    #app {
      display: none;

      position: relative;

      width: 100vw;
      height: 100dvh;

      overflow: hidden;

      background: #080808;
    }


    /* =====================================================
       FULLSCREEN ALBUM ART
    ===================================================== */

    #background {
      position: absolute;

      inset: -25px;

      background-size: cover;

      background-position: center;

      background-repeat: no-repeat;

      transform: scale(1.04);

      opacity: 1;

      filter:
        saturate(1.05);

      z-index: 0;

      transition:
        background-image 0.8s ease,
        transform 1.2s ease;
    }


    /* =====================================================
       LEFT → RIGHT FADE
    ===================================================== */

    #backgroundOverlay {
      position: absolute;

      inset: 0;

      z-index: 1;

      pointer-events: none;

      background:
        linear-gradient(
          90deg,

          rgba(8, 8, 8, 1) 0%,

          rgba(8, 8, 8, 0.98) 10%,

          rgba(8, 8, 8, 0.92) 22%,

          rgba(8, 8, 8, 0.76) 36%,

          rgba(8, 8, 8, 0.52) 50%,

          rgba(8, 8, 8, 0.27) 65%,

          rgba(8, 8, 8, 0.10) 80%,

          rgba(8, 8, 8, 0.02) 92%,

          rgba(8, 8, 8, 0) 100%
        );
    }


    /* =====================================================
       TOP / BOTTOM DARKENING
    ===================================================== */

    #backgroundOverlay::after {
      content: "";

      position: absolute;

      inset: 0;

      background:
        linear-gradient(
          180deg,
          rgba(0,0,0,0.25) 0%,
          rgba(0,0,0,0) 35%,
          rgba(0,0,0,0.25) 100%
        );

      pointer-events: none;
    }


    /* =====================================================
       CONTENT
    ===================================================== */

    #content {
      position: relative;

      z-index: 5;

      width: 100%;
      height: 100%;

      display: flex;

      align-items: center;

      justify-content: flex-start;

      padding:
        100px
        7vw
        50px;
    }


    /* =====================================================
       HEADER
    ===================================================== */

    #header {
      position: absolute;

      top:
        max(25px, env(safe-area-inset-top));

      left:
        max(35px, env(safe-area-inset-left));

      right:
        max(35px, env(safe-area-inset-right));

      display: flex;

      align-items: center;

      justify-content: space-between;

      z-index: 10;
    }


    #logo {
      font-size: 20px;

      font-weight: 800;

      letter-spacing: -1px;

      text-shadow:
        0 2px 15px rgba(0,0,0,0.6);
    }


    /* =====================================================
       CURRENT TIME CLOCK
    ===================================================== */

    #clock {
      position: absolute;

      left: 50%;

      transform: translateX(-50%);

      font-size: 18px;

      font-weight: 600;

      letter-spacing: 0.2px;

      color:
        rgba(255,255,255,0.88);

      text-shadow:
        0 2px 15px rgba(0,0,0,0.65);

      white-space: nowrap;
    }


    /* =====================================================
       STATUS AREA
    ===================================================== */

    #statusArea {
      display: flex;

      align-items: center;

      justify-content: flex-end;

      gap: 10px;
    }


    #status {
      display: inline-flex;

      align-items: center;

      justify-content: center;

      min-height: 30px;

      padding:
        7px
        13px;

      border-radius: 999px;

      font-size: 11px;

      font-weight: 800;

      letter-spacing: 0.7px;

      text-transform: uppercase;

      transition:
        background 0.25s ease,
        color 0.25s ease,
        box-shadow 0.25s ease;
    }


    #status.playing {
      background:
        rgba(30, 215, 96, 0.18);

      color:
        #1ed760;

      border:
        1px solid rgba(30, 215, 96, 0.35);

      box-shadow:
        0 5px 25px rgba(30, 215, 96, 0.12);
    }


    #status.paused {
      background:
        rgba(255, 165, 70, 0.18);

      color:
        #ffad5c;

      border:
        1px solid rgba(255, 165, 70, 0.35);

      box-shadow:
        0 5px 25px rgba(255, 165, 70, 0.10);
    }


    #status.idle {
      background:
        rgba(255,255,255,0.10);

      color:
        rgba(255,255,255,0.65);

      border:
        1px solid rgba(255,255,255,0.12);
    }


    #deviceName {
      color:
        rgba(255,255,255,0.70);

      font-size: 12px;

      font-weight: 500;

      max-width: 220px;

      overflow: hidden;

      white-space: nowrap;

      text-overflow: ellipsis;

      text-shadow:
        0 2px 10px rgba(0,0,0,0.7);
    }


    /* =====================================================
       PLAYING AREA
    ===================================================== */

    #playing {
      width: min(650px, 48vw);

      display: flex;

      flex-direction: column;

      align-items: flex-start;

      justify-content: center;
    }


    /* =====================================================
       HIDE OLD ALBUM ART
    ===================================================== */

    #albumArt {
      display: none;
    }


    /* =====================================================
       TRACK INFO
    ===================================================== */

    #trackInfo {
      width: 100%;

      margin-top: 0;

      text-align: left;
    }


    /* =====================================================
       SONG TITLE
    ===================================================== */

    #trackName {
      font-size:
        clamp(42px, 5vw, 64px);

      font-weight: 800;

      line-height: 1.04;

      letter-spacing: -2px;

      color: white;

      max-width: 650px;

      overflow-wrap: anywhere;

      text-shadow:
        0 4px 25px rgba(0,0,0,0.55);
    }


    /* =====================================================
       ARTIST
    ===================================================== */

    #artistName {
      margin-top: 13px;

      color:
        rgba(255,255,255,0.82);

      font-size:
        clamp(19px, 2vw, 25px);

      font-weight: 500;

      line-height: 1.3;

      text-shadow:
        0 3px 18px rgba(0,0,0,0.55);
    }


    /* =====================================================
       PLAYLIST
    ===================================================== */

    #playlistName {
      margin-top: 9px;

      color:
        rgba(255,255,255,0.55);

      font-size: 16px;

      font-weight: 500;

      line-height: 1.3;

      white-space: normal;

      overflow: hidden;

      text-overflow: ellipsis;

      text-shadow:
        0 2px 12px rgba(0,0,0,0.6);
    }


    /* =====================================================
       PROGRESS
    ===================================================== */

    #progressContainer {
      width: 100%;

      margin-top: 30px;
    }


    #progressBar {
      width: 100%;

      height: 6px;

      background:
        rgba(255,255,255,0.20);

      border-radius: 999px;

      overflow: hidden;

      cursor: pointer;

      box-shadow:
        0 2px 12px rgba(0,0,0,0.25);
    }


    #progress {
      width: 0%;

      height: 100%;

      background: white;

      border-radius: 999px;

      transition:
        width 0.15s linear;
    }


    /* =====================================================
       TIME
    ===================================================== */

    #time {
      display: flex;

      justify-content: space-between;

      width: 100%;

      margin-top: 11px;

      font-family:
        "Inter",
        "SF Pro Display",
        "Helvetica Neue",
        Arial,
        sans-serif;

      font-size: 16px;

      font-weight: 600;

      letter-spacing: 0.2px;

      color:
        rgba(255,255,255,0.82);

      text-shadow:
        0 2px 12px rgba(0,0,0,0.65);
    }


    /* =====================================================
       CONTROLS
    ===================================================== */

    #controls {
      display: flex;

      align-items: center;

      justify-content: flex-start;

      gap: 16px;

      margin-top: 23px;
    }


    .control {
      width: 44px;
      height: 44px;

      border: none;

      border-radius: 50%;

      background:
        rgba(255,255,255,0.10);

      color: white;

      display: flex;

      align-items: center;
      justify-content: center;

      cursor: pointer;

      position: relative;

      transition:
        background 0.15s ease,
        transform 0.15s ease;
    }


    .control:hover {
      background:
        rgba(255,255,255,0.20);

      transform: scale(1.05);
    }


    .control:active {
      transform: scale(0.94);
    }


    /* =====================================================
       CSS PLAY ICON
    ===================================================== */

    #playButton {
      width: 56px;
      height: 56px;

      background: white;

      color: black;
    }


    #playButton:hover {
      background: #eeeeee;
    }


    #playButton .icon-play {
      width: 0;
      height: 0;

      border-top: 9px solid transparent;
      border-bottom: 9px solid transparent;
      border-left: 13px solid black;

      margin-left: 3px;
    }


    #playButton .icon-pause {
      display: flex;

      gap: 4px;
    }


    #playButton .icon-pause::before,
    #playButton .icon-pause::after {
      content: "";

      width: 4px;
      height: 17px;

      border-radius: 2px;

      background: black;
    }


    /* =====================================================
       CSS PREVIOUS / NEXT ICONS
    ===================================================== */

    .icon-previous,
    .icon-next {
      width: 18px;
      height: 16px;

      position: relative;
    }


    .icon-previous::before,
    .icon-next::before {
      content: "";

      position: absolute;

      top: 0;

      width: 0;
      height: 0;

      border-top: 8px solid transparent;
      border-bottom: 8px solid transparent;
    }


    .icon-previous::after,
    .icon-next::after {
      content: "";

      position: absolute;

      top: 1px;

      width: 3px;
      height: 14px;

      border-radius: 2px;

      background: white;
    }


    .icon-previous::before {
      left: 1px;

      border-right: 9px solid white;
    }


    .icon-previous::after {
      left: 14px;
    }


    .icon-next::before {
      right: 1px;

      border-left: 9px solid white;
    }


    .icon-next::after {
      right: 14px;
    }


    /* =====================================================
       VOLUME
    ===================================================== */

    #volumeContainer {
      width: min(100%, 380px);

      display: flex;

      align-items: center;

      gap: 10px;

      margin-top: 19px;
    }


    #volumeButton {
      width: 30px;
      height: 30px;

      border: none;

      background: transparent;

      color: white;

      cursor: pointer;

      display: flex;

      align-items: center;

      justify-content: center;

      flex-shrink: 0;

      position: relative;
    }


    /* =====================================================
       CSS VOLUME ICON
    ===================================================== */

    .volumeIcon {
      width: 19px;
      height: 16px;

      position: relative;

      display: block;
    }


    .volumeIcon::before {
      content: "";

      position: absolute;

      left: 0;
      top: 5px;

      width: 5px;
      height: 7px;

      background: currentColor;

      border-radius: 1px;
    }


    .volumeIcon::after {
      content: "";

      position: absolute;

      left: 4px;
      top: 2px;

      width: 0;
      height: 0;

      border-top: 6px solid transparent;
      border-bottom: 6px solid transparent;
      border-right: 8px solid currentColor;
    }


    .volumeWave {
      position: absolute;

      left: 12px;
      top: 3px;

      width: 7px;
      height: 10px;

      border:
        2px solid currentColor;

      border-left:
        0;

      border-top-color:
        transparent;

      border-bottom-color:
        transparent;

      border-radius: 0 10px 10px 0;
    }


    .volumeWave.large {
      left: 14px;

      width: 5px;

      height: 14px;

      top: 1px;

      opacity: 0.65;
    }


    #volumeSlider {
      flex: 1;

      appearance: none;

      -webkit-appearance: none;

      height: 4px;

      border-radius: 999px;

      background:
        rgba(255,255,255,0.22);

      outline: none;

      cursor: pointer;
    }


    #volumeSlider::-webkit-slider-thumb {
      appearance: none;

      -webkit-appearance: none;

      width: 14px;
      height: 14px;

      border-radius: 50%;

      background: white;

      cursor: pointer;
    }


    #volumeSlider::-moz-range-thumb {
      width: 14px;
      height: 14px;

      border: none;

      border-radius: 50%;

      background: white;

      cursor: pointer;
    }


    #volumePercentage {
      width: 38px;

      text-align: right;

      color: #aaa;

      font-size: 11px;
    }


    /* =====================================================
       NOTHING PLAYING
    ===================================================== */

    #nothingPlaying {
      display: none;

      text-align: left;
    }


    #nothingPlaying h2 {
      font-size: 36px;

      margin-bottom: 8px;
    }


    #nothingPlaying p {
      color: #aaa;

      font-size: 16px;
    }


    /* =====================================================
       MOBILE PORTRAIT
    ===================================================== */

    @media (max-width: 600px) {

      #content {
        padding:
          80px
          25px
          max(25px, env(safe-area-inset-bottom));
      }


      #header {
        left:
          max(18px, env(safe-area-inset-left));

        right:
          max(18px, env(safe-area-inset-right));
      }


      #logo {
        font-size: 18px;
      }


      #clock {
        font-size: 15px;
      }


      #statusArea {
        gap: 6px;
      }


      #deviceName {
        max-width: 110px;

        font-size: 10px;
      }


      #status {
        min-height: 27px;

        padding:
          6px
          10px;

        font-size: 9px;
      }


      #playing {
        width: 100%;
      }


      #trackName {
        font-size:
          clamp(34px, 10vw, 48px);

        letter-spacing:
          -1.3px;
      }


      #artistName {
        font-size: 18px;
      }


      #playlistName {
        font-size: 14px;
      }


      #progressContainer {
        margin-top: 24px;
      }


      #time {
        font-size: 14px;
      }


      #backgroundOverlay {
        background:
          linear-gradient(
            90deg,

            rgba(8,8,8,0.96) 0%,

            rgba(8,8,8,0.85) 35%,

            rgba(8,8,8,0.45) 70%,

            rgba(8,8,8,0.08) 100%
          );
      }
    }


    /* =====================================================
       LANDSCAPE
    ===================================================== */

    @media
      (orientation: landscape)
      and (max-height: 600px) {

      #content {
        padding:
          65px
          7vw
          30px;
      }


      #header {
        top:
          max(12px, env(safe-area-inset-top));
      }


      #playing {
        width:
          min(600px, 50vw);
      }


      #trackName {
        font-size:
          clamp(30px, 6vh, 48px);

        letter-spacing:
          -1.5px;
      }


      #artistName {
        font-size: 17px;

        margin-top: 8px;
      }


      #playlistName {
        font-size: 13px;

        margin-top: 5px;
      }


      #progressContainer {
        margin-top: 17px;
      }


      #controls {
        margin-top: 13px;
      }


      #volumeContainer {
        margin-top: 10px;
      }


      #clock {
        font-size: 15px;
      }
    }


    /* =====================================================
       VERY SHORT LANDSCAPE
    ===================================================== */

    @media
      (orientation: landscape)
      and (max-height: 430px) {

      #content {
        padding:
          45px
          7vw
          20px;
      }


      #trackName {
        font-size:
          clamp(25px, 6vh, 38px);
      }


      #artistName {
        font-size: 14px;
      }


      #playlistName {
        font-size: 11px;
      }


      #progressContainer {
        margin-top: 10px;
      }


      #controls {
        margin-top: 8px;
      }


      #volumeContainer {
        margin-top: 5px;
      }


      .control {
        width: 38px;
        height: 38px;
      }


      #playButton {
        width: 48px;
        height: 48px;
      }
    }

  </style>
</head>


<body>


  <!-- =====================================================
       CONNECT SCREEN
  ===================================================== -->

  <div id="connectScreen">

    <div id="connectBox">

      <div id="connectLogo">
        ♪
      </div>

      <h1>SpotifyDis</h1>

      <p>
        Connect your Spotify account to display
        your currently playing music.
      </p>

      <button
        id="connectButton"
        type="button"
        onclick="login()"
      >
        Connect Spotify
      </button>

    </div>

  </div>


  <!-- =====================================================
       MAIN APP
  ===================================================== -->

  <div id="app">

    <div id="background"></div>

    <div id="backgroundOverlay"></div>


    <div id="content">


      <!-- HEADER -->

      <div id="header">

        <div id="logo">
          SPOTIFYDIS
        </div>


        <!-- LIVE CURRENT TIME -->

        <div id="clock">
          8:00 PM
        </div>


        <div id="statusArea">

          <div id="deviceName">
            —
          </div>

          <div
            id="status"
            class="idle"
          >
            Connected
          </div>

        </div>

      </div>


      <!-- NOW PLAYING -->

      <div id="playing">


        <!-- Kept for JavaScript compatibility -->

        <img
          id="albumArt"
          src=""
          alt="Album artwork"
        >


        <!-- TRACK INFORMATION -->

        <div id="trackInfo">

          <div id="trackName">
            Nothing Playing
          </div>

          <div id="artistName">
            —
          </div>

          <div id="playlistName">
            No playlist
          </div>

        </div>


        <!-- PROGRESS -->

        <div id="progressContainer">

          <div id="progressBar">

            <div id="progress"></div>

          </div>


          <div id="time">

            <span id="currentTime">
              0:00
            </span>

            <span id="duration">
              0:00
            </span>

          </div>

        </div>


        <!-- CONTROLS -->

        <div id="controls">

          <button
            class="control"
            id="previousButton"
            type="button"
            title="Previous"
            aria-label="Previous track"
          >
            <span class="icon-previous"></span>
          </button>


          <button
            class="control"
            id="playButton"
            type="button"
            title="Play / Pause"
            aria-label="Play or pause"
          >
            <span class="icon-play"></span>
          </button>


          <button
            class="control"
            id="nextButton"
            type="button"
            title="Next"
            aria-label="Next track"
          >
            <span class="icon-next"></span>
          </button>

        </div>


        <!-- VOLUME -->

        <div id="volumeContainer">

          <button
            id="volumeButton"
            type="button"
            title="Mute"
            aria-label="Mute"
          >

            <span class="volumeIcon">

              <span class="volumeWave"></span>

              <span class="volumeWave large"></span>

            </span>

          </button>


          <input
            id="volumeSlider"
            type="range"
            min="0"
            max="100"
            value="50"
            step="1"
          >


          <span id="volumePercentage">
            50%
          </span>

        </div>

      </div>


      <!-- NOTHING PLAYING -->

      <div id="nothingPlaying">

        <h2>
          Nothing Playing
        </h2>

        <p>
          Start playing something on Spotify.
        </p>

      </div>

    </div>

  </div>


  <script>

    /* =====================================================
       SPOTIFY CONFIG
    ===================================================== */

    const SPOTIFY_CLIENT_ID =
      "3f16de704ed44b8aac1ce33d94c4db45";


    const REDIRECT_URI =
      "https://whatuwantsohai.github.io/SpotifyDisV1/";


    const SCOPES = [
      "user-read-currently-playing",
      "user-read-playback-state",
      "user-modify-playback-state",
      "user-read-private",
      "user-read-email",

    /* =====================================================
       PKCE
    ===================================================== */

    function generateRandomString(
      length
    ) {

      const characters =
        "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789";


      let result = "";


      const randomValues =
        crypto.getRandomValues(
          new Uint8Array(length)
        );


      for (
        let i = 0;
        i < length;
        i++
      ) {

        result +=
          characters[
            randomValues[i] %
            characters.length
          ];

      }


      return result;

    }


    async function sha256(
      plain
    ) {

      const encoder =
        new TextEncoder();


      const data =
        encoder.encode(
          plain
        );


      return window.crypto.subtle.digest(
        "SHA-256",
        data
      );

    }


    function base64UrlEncode(
      input
    ) {

      return btoa(
        String.fromCharCode(
          ...new Uint8Array(input)
        )
      )
      .replace(
        /\+/g,
        "-"
      )
      .replace(
        /\//g,
        "_"
      )
      .replace(
        /=+$/,
        ""
      );

    }


    async function createCodeChallenge(
      verifier
    ) {

      const hashed =
        await sha256(
          verifier
        );


      return base64UrlEncode(
        hashed
      );

    }


    /* =====================================================

    async function login() {

      console.log(

            64
          );


        const challenge =
          await createCodeChallenge(
            verifier
          );


        sessionStorage.setItem(
          "spotify_code_verifier",
          verifier
        );


        const params =
          new URLSearchParams({

            client_id:
              SPOTIFY_CLIENT_ID,

            response_type:
              "code",

            redirect_uri:
              REDIRECT_URI,

            code_challenge_method:
              "S256",

            code_challenge:
              challenge,

            scope:
              SCOPES

          });


        window.location.href =
          "https://accounts.spotify.com/authorize?" +
          params.toString();

      }


      catch (error) {

        console.error(
          "Login error:",
          error
        );


        alert(
          "Unable to start Spotify login."
        );

      }

    }

    /* =====================================================
       TOKEN EXCHANGE
    ===================================================== */

    async function exchangeCodeForToken(
      code
    ) {

      const verifier =
        sessionStorage.getItem(
          "spotify_code_verifier"
        );


      if (!verifier) {

        throw new Error(
          "Missing PKCE verifier."
        );

      }


      const body =
        new URLSearchParams({

          client_id:
            SPOTIFY_CLIENT_ID,

          grant_type:
            "authorization_code",

          code:
            code,

          redirect_uri:
            REDIRECT_URI,

          code_verifier:
            verifier

        });


      const response =
        await fetch(
          "https://accounts.spotify.com/api/token",
          {
            method: "POST",

            headers: {
              "Content-Type":
                "application/x-www-form-urlencoded"
            },

            body:
              body.toString()
          }
        );


      const data =
        await response.json();


      if (!response.ok) {

        console.error(
          "Token error:",
          data
        );


        throw new Error(
          data.error_description ||
          "Token exchange failed."
        );

      }


      localStorage.setItem(
        "spotify_access_token",
        data.access_token
      );


      if (
        data.refresh_token
      ) {

        localStorage.setItem(
          "spotify_refresh_token",
          data.refresh_token
        );

      }


      const expiresAt =
        Date.now() +
        data.expires_in * 1000;


      localStorage.setItem(
        "spotify_token_expires",
        expiresAt.toString()
      );


      sessionStorage.removeItem(
        "spotify_code_verifier"
      );


      return data.access_token;

    }


    /* =====================================================
       REFRESH TOKEN
    ===================================================== */

    async function refreshToken() {

      const refresh =
        localStorage.getItem(
          "spotify_refresh_token"
        );


      if (!refresh) {

        return false;

      }


      const body =
        new URLSearchParams({

          client_id:
            SPOTIFY_CLIENT_ID,

          grant_type:
            "refresh_token",

          refresh_token:
            refresh

        });


      const response =
        await fetch(
          "https://accounts.spotify.com/api/token",
          {
            method: "POST",

            headers: {
              "Content-Type":
                "application/x-www-form-urlencoded"
            },

            body:
              body.toString()
          }
        );


      if (!response.ok) {

        return false;

      }


      const data =
        await response.json();


      localStorage.setItem(
        "spotify_access_token",
        data.access_token
      );


      if (
        data.refresh_token
      ) {

        localStorage.setItem(
          "spotify_refresh_token",
          data.refresh_token
        );

      }


      const expiresAt =
        Date.now() +
        data.expires_in * 1000;


      localStorage.setItem(
        "spotify_token_expires",
        expiresAt.toString()
      );


      return true;

    }


    /* =====================================================
       GET ACCESS TOKEN
    ===================================================== */

    async function getAccessToken() {

      let token =
        localStorage.getItem(
          "spotify_access_token"
        );


      const expires =
        Number(
          localStorage.getItem(
            "spotify_token_expires"
          ) || 0
        );


      if (
        !token ||
        Date.now() >
        expires - 60000
      ) {

        const refreshed =
          await refreshToken();


        if (refreshed) {

          token =
            localStorage.getItem(
              "spotify_access_token"
            );

        }

      }


      return token;

    }


    /* =====================================================
       SPOTIFY API
    ===================================================== */

    async function spotifyFetch(
      endpoint,
      options = {}
    ) {

      let token =
        await getAccessToken();


      if (!token) {

        throw new Error(
          "Not authenticated."
        );

      }


      options.headers = {

        ...(options.headers || {}),

        Authorization:
          "Bearer " + token

      };


      let response =
        await fetch(
          "https://api.spotify.com/v1" +
          endpoint,
          options
        );


      if (
        response.status === 401
      ) {

        const refreshed =
          await refreshToken();


        if (!refreshed) {

          logout();

          throw new Error(
            "Spotify session expired."
          );

        }


        token =
          localStorage.getItem(
            "spotify_access_token"
          );


        options.headers.Authorization =
          "Bearer " + token;


        response =
          await fetch(
            "https://api.spotify.com/v1" +
            endpoint,
            options
          );

      }


      return response;

    }


    /* =====================================================
       PLAYLIST NAME
    ===================================================== */

    async function getPlaylistName(
      context
    ) {

      if (
        !context ||
        !context.uri
      ) {

        return "No playlist";

      }


      if (
        context.type !== "playlist" ||
        !context.uri.includes(
          "spotify:playlist:"
        )
      ) {

        return "Album / Other";

      }


      const playlistId =
        context.uri.split(
          ":"
        ).pop();


      try {

        const response =
          await spotifyFetch(
            "/playlists/" +
            playlistId +
            "?fields=name"
          );


        if (!response.ok) {

          return "Playlist";

        }


        const data =
          await response.json();


        if (data.name) {

          return data.name;

        }

      }


      catch (error) {

        console.error(
          "Playlist lookup error:",
          error
        );

      }


      return "Playlist";

    }


    /* =====================================================
       CURRENT TRACK
    ===================================================== */

    async function getCurrentTrack() {

      try {

        const response =
          await spotifyFetch(
            "/me/player"
          );


        if (
          response.status === 204
        ) {

          showNothingPlaying();

          return;

        }


        if (!response.ok) {

          console.error(
            "Playback request failed:",
            response.status
          );

          return;

        }


        const data =
          await response.json();


        if (
          !data ||
          !data.item
        ) {

          showNothingPlaying();

          return;

        }


        await showPlaying(
          data
        );

      }


      catch (error) {

        console.error(
          "Playback error:",
          error
        );

      }

    }


    /* =====================================================
       DISPLAY TRACK
    ===================================================== */

    async function showPlaying(
      data
    ) {

      playing.style.display =
        "flex";


      nothingPlaying.style.display =
        "none";


      const track =
        data.item;


      trackName.textContent =
        track.name;


      artistName.textContent =
        track.artists
          .map(
            artist =>
              artist.name
          )
          .join(", ");


      playlistName.textContent =
        await getPlaylistName(
          data.context
        );


      const image =
        track.album &&
        track.album.images &&
        track.album.images.length
          ? track.album.images[0].url
          : "";


      if (image) {

        albumArt.src =
          image;


        background.style.backgroundImage =
          `url("${image}")`;

      }


      const trackDuration =
        track.duration_ms || 0;


      const trackProgress =
        data.progress_ms || 0;


      /* ===================================================
         PLAYBACK SYNCHRONIZATION
      =================================================== */

      currentTrackId =
        track.id || null;


      syncedProgressMs =
        trackProgress;


      syncedDurationMs =
        trackDuration;


      syncedIsPlaying =
        Boolean(
          data.is_playing
        );


      syncTimestamp =
        Date.now();


      duration.textContent =
        formatTime(
          trackDuration
        );


      updatePlaybackDisplay();


      /* ===================================================
         PLAY BUTTON
      =================================================== */

      updatePlayButton(
        data.is_playing
      );


      /* ===================================================
         DEVICE
      =================================================== */

      if (
        data.device &&
        data.device.name
      ) {

        deviceName.textContent =
          data.device.name;

      }

      else {

        deviceName.textContent =
          "Unknown device";

      }


      /* ===================================================
         PLAYBACK STATUS
      =================================================== */

      updateStatus(
        data.is_playing
      );


      /* ===================================================
         VOLUME
      =================================================== */

      if (
        typeof data.device?.volume_percent ===
        "number"
      ) {

        updateVolumeUI(
          data.device.volume_percent
        );

      }

    }

       STATUS PILL

    function updateStatus(

      status.classList.remove(
        "playing",
        "paused",
        "idle"
      );


      if (isPlaying) {

        status.textContent =
          "Playing";

        status.classList.add(

    /* =====================================================

    ===================================================== */

    }


    /* =====================================================
       LIVE PLAYBACK DISPLAY
    ===================================================== */

    function updatePlaybackDisplay() {

      let displayProgress =
        syncedProgressMs;


      if (
        syncedIsPlaying
      ) {

        const elapsed =
          Date.now() -
          syncTimestamp;


        displayProgress =
          syncedProgressMs +
          elapsed;

      }


      displayProgress =
        Math.max(
          0,
          Math.min(
            displayProgress,
            syncedDurationMs
          )
        );


      currentTime.textContent =
        formatTime(
          displayProgress
        );


      const percentage =
        syncedDurationMs
          ? (
              displayProgress /
              syncedDurationMs
            ) * 100
          : 0;


      progress.style.width =
        Math.min(
          percentage,
          100
        ) + "%";

    }


    /* =====================================================
       NOTHING PLAYING
    ===================================================== */

    function showNothingPlaying() {

      playing.style.display =
        "none";


      nothingPlaying.style.display =
        "block";

      status.classList.remove(
        "playing",
        "paused"

      status.classList.add(
        "idle"
      );


      deviceName.textContent =
        "—";


      currentTrackId =
        null;


      syncedProgressMs =
        0;


      syncedDurationMs =
        0;


      syncedIsPlaying =
        false;


      syncTimestamp =
        Date.now();


      updatePlayButton(
        false
      );


      currentTime.textContent =
        "0:00";


      duration.textContent =
        "0:00";


      progress.style.width =
        "0%";

    }


    /* =====================================================
       TIME FORMAT
    ===================================================== */

    function formatTime(
      ms
    ) {

      const totalSeconds =
        Math.floor(
          ms / 1000
        );


      const minutes =
        Math.floor(
          totalSeconds / 60
        );


      const seconds =
        totalSeconds % 60;


      return (
        minutes +
        ":" +
        seconds
          .toString()
          .padStart(
            2,
            "0"
          )
      );

    }


    /* =====================================================

    ===================================================== */

    async function togglePlay() {

      try {

        const response =

        if (
          response.status ===
          204

          return;

        }


        const data =

        if (
          data.is_playing
        ) {

          await spotifyFetch(
            "/me/player/pause",

              method: "PUT"
            }
          );

        }

        else {

          await spotifyFetch(

            }
          );

        }


        setTimeout(

          300
        );

        );

      }

    }

    /* =====================================================
       SEEK
    ===================================================== */

    async function seek(
      event
    ) {

      try {

        const rect =
          progressBar.getBoundingClientRect();


        const percentage =
          (
            event.clientX -
            rect.left
          ) /
          rect.width;


        const response =
          await spotifyFetch(
            "/me/player"
          );


        if (
          response.status ===
          204
        ) {

          return;

        }


        const data =
          await response.json();


        if (
          !data.item
        ) {

          return;

        }


        const durationMs =
          data.item.duration_ms;


        const position =
          Math.floor(
            Math.max(
              0,
              Math.min(
                percentage,
                1
              )
            ) *
            durationMs
          );


        await spotifyFetch(
          "/me/player/seek?position_ms=" +
          position,
          {
            method: "PUT"
          }
        );


        syncedProgressMs =
          position;


        syncedDurationMs =
          durationMs;


        syncedIsPlaying =
          Boolean(
            data.is_playing
          );


        syncTimestamp =
          Date.now();


        updatePlaybackDisplay();

      }


      catch (error) {

        console.error(
          "Seek error:",
          error
        );

      }

    }


    /* =====================================================
       VOLUME UI
    ===================================================== */

    function updateVolumeUI(
      volume
    ) {

      currentVolume =
        Math.max(
          0,
          Math.min(
            100,
            Math.round(volume)
          )
        );


      volumeSlider.value =
        currentVolume;


      volumePercentage.textContent =
        currentVolume + "%";


      updateVolumeIcon();

    }


    function updateVolumeIcon() {

      const icon =
        volumeButton.querySelector(
          ".volumeIcon"
        );


      if (!icon) {

        return;

      }


      const wave1 =
        icon.querySelector(
          ".volumeWave"
        );


      const wave2 =
        icon.querySelector(
          ".volumeWave.large"
        );


      if (
        currentVolume === 0
      ) {

        wave1.style.display =
          "none";

        wave2.style.display =
          "none";

      }

      else if (
        currentVolume < 50
      ) {

        wave1.style.display =
          "block";

        wave2.style.display =
          "none";

      }

      else {

        wave1.style.display =
          "block";

        wave2.style.display =
          "block";

      }

    }


    /* =====================================================
       SET VOLUME
    ===================================================== */

    async function setVolume(
      volume
    ) {

      volume =
        Math.max(
          0,
          Math.min(
            100,
            Number(volume)
          )
        );


      try {

        const response =
          await spotifyFetch(
            "/me/player/volume?volume_percent=" +
            Math.round(volume),
            {
              method: "PUT"
            }
          );


        if (!response.ok) {

          console.error(
            "Volume request failed:",
            response.status
          );

          return;

        }


        currentVolume =
          Math.round(volume);


        updateVolumeUI(
          currentVolume
        );

      }


      catch (error) {

        console.error(
          "Volume error:",
          error
        );

      }

    }


    /* =====================================================
       MUTE
    ===================================================== */

    async function toggleMute() {

      if (
        currentVolume > 0
      ) {

        previousVolume =
          currentVolume;


        await setVolume(
          0
        );

      }

      else {

        await setVolume(
          previousVolume ||
          50
        );

      }

    }


    /* =====================================================
       LOGOUT
    ===================================================== */

    function logout() {

      localStorage.removeItem(
        "spotify_access_token"
      );


      localStorage.removeItem(
        "spotify_refresh_token"
      );


      localStorage.removeItem(
        "spotify_token_expires"
      );


      app.style.display =
        "none";


      connectScreen.style.display =
        "flex";

    }


    /* =====================================================
       AUTH CALLBACK
    ===================================================== */

    async function handleCallback() {

      const params =
        new URLSearchParams(
          window.location.search
        );


      const code =
        params.get(
          "code"
        );


      const error =
        params.get(
          "error"
        );


      if (error) {

        console.error(
          "Spotify authorization error:",
          error
        );

        return;

      }


      if (!code) {

        return;

      }


      try {

        await exchangeCodeForToken(
          code
        );


        window.history.replaceState(
          {},
          document.title,
          REDIRECT_URI
        );


        openApp();

      }


      catch (error) {

        console.error(
          "Authentication failed:",
          error
        );


        alert(
          "Spotify authentication failed. Check the browser console for details."
        );

      }

    }


    /* =====================================================
       OPEN APP
    ===================================================== */

    async function openApp() {

      const token =
        await getAccessToken();


      if (!token) {

        connectScreen.style.display =
          "flex";


        app.style.display =
          "none";


        return;

      }


      connectScreen.style.display =
        "none";


      app.style.display =
        "block";


      await getCurrentTrack();

    }


    /* =====================================================
       BUTTON EVENTS
    ===================================================== */

    playButton.addEventListener(
      "click",
      togglePlay
    );


    nextButton.addEventListener(
      "click",
      nextTrack
    );


    previousButton.addEventListener(
      "click",
      previousTrack
    );


    progressBar.addEventListener(
      "click",
      seek
    );


    volumeSlider.addEventListener(
      "input",
      () => {

        const value =
          Number(
            volumeSlider.value
          );


        currentVolume =
          value;


        volumePercentage.textContent =
          value + "%";


        updateVolumeIcon();

      }
    );


    volumeSlider.addEventListener(
      "change",
      () => {

        setVolume(
          volumeSlider.value
        );

      }
    );


    volumeButton.addEventListener(
      "click",
      toggleMute
    );


    /* =====================================================
       INITIALIZE
    ===================================================== */

    (async function init() {

      await handleCallback();


      const token =
        await getAccessToken();


      if (token) {

        openApp();

      }

    })();


    /* =====================================================
       LIVE TRACK TIMER
       
       Updates locally every 250ms.
       Spotify is checked every 5 seconds
       to correct any drift.
    ===================================================== */

    setInterval(
      () => {

        if (
          playing.style.display !==
          "none"
        ) {

          updatePlaybackDisplay();

        }

      },
      250
    );


    /* =====================================================
       REFRESH SPOTIFY PLAYBACK

    setInterval(
