<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>SpotifyDis</title>

<style>
* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Roboto,
    Helvetica,
    Arial,
    sans-serif;
  background: #080808;
  color: white;
}

body {
  position: relative;
}

/* =========================
   BACKGROUND
========================= */

#background {
  position: fixed;
  inset: 0;
  z-index: 0;
  overflow: hidden;
  background: #080808;
}

#backgroundImage {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  filter:
    blur(18px)
    brightness(0.55);
  transform: scale(1.08);
  opacity: 0;
  transition:
    opacity 0.8s ease,
    filter 0.8s ease;
}

#backgroundOverlay {
  position: absolute;
  inset: 0;
  background:
    linear-gradient(
      90deg,
      rgba(8,8,8,0.98) 0%,
      rgba(8,8,8,0.90) 30%,
      rgba(8,8,8,0.55) 65%,
      rgba(8,8,8,0.12) 100%
    );
}

/* =========================
   HEADER
========================= */

#header {
  position: fixed;
  top: max(20px, env(safe-area-inset-top));
  left: max(25px, env(safe-area-inset-left));
  right: max(25px, env(safe-area-inset-right));

  display: flex;
  align-items: center;
  justify-content: space-between;

  z-index: 10;
}

#logo {
  font-size: 22px;
  font-weight: 700;
  letter-spacing: -0.5px;
}

#statusArea {
  display: flex;
  align-items: center;
  gap: 10px;
}

#clock {
  font-size: 18px;
  font-weight: 600;
  opacity: 0.9;
  font-variant-numeric: tabular-nums;
}

#deviceName {
  max-width: 180px;
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;

  font-size: 12px;
  font-weight: 500;
  opacity: 0.7;
}

#status {
  display: flex;
  align-items: center;
  justify-content: center;

  min-height: 30px;
  padding: 7px 12px;

  border-radius: 999px;

  font-size: 10px;
  font-weight: 800;
  letter-spacing: 0.6px;
  text-transform: uppercase;

  background: rgba(255,255,255,0.12);
  border: 1px solid rgba(255,255,255,0.12);

  transition:
    background 0.25s ease,
    color 0.25s ease;
}

#status.playing {
  background: rgba(40, 180, 90, 0.22);
  color: #58d68d;
  border-color: rgba(40,180,90,0.35);
}

#status.paused {
  background: rgba(255, 160, 50, 0.22);
  color: #ffb45c;
  border-color: rgba(255,160,50,0.35);
}

/* =========================
   CONTENT
========================= */

#content {
  position: relative;
  z-index: 2;

  width: 100%;
  height: 100%;

  display: flex;
  align-items: center;
  justify-content: center;

  padding:
    100px
    6vw
    50px;
}

#nowPlayingLayout {
  width: 100%;
  max-width: 1500px;

  display: flex;
  align-items: center;
  justify-content: center;

  gap: 70px;
}

#playing {
  width: min(650px, 50vw);
  flex-shrink: 1;
}

/* =========================
   ALBUM ART
========================= */

#albumArtContainer {
  width: clamp(320px, 34vw, 480px);
  aspect-ratio: 1 / 1;

  flex-shrink: 0;

  border-radius: 22px;
  overflow: hidden;

  background:
    rgba(255,255,255,0.06);

  border:
    1px solid rgba(255,255,255,0.12);

  box-shadow:
    0 25px 70px rgba(0,0,0,0.55),
    0 8px 30px rgba(0,0,0,0.35);

  transform:
    translateZ(0);

  position: relative;
}

#albumArtDisplay {
  width: 100%;
  height: 100%;

  object-fit: cover;

  display: block;

  opacity: 0;

  transition:
    opacity 0.5s ease;
}

#albumArt {
  display: none;
}

/* =========================
   TRACK INFO
========================= */

#trackInfo {
  width: 100%;
}

#trackName {
  font-size:
    clamp(42px, 5vw, 72px);

  line-height: 1.02;

  font-weight: 800;

  letter-spacing:
    -2.5px;

  margin: 0;

  max-width: 900px;

  text-wrap: balance;
}

#artistName {
  margin-top: 14px;

  font-size: 22px;

  font-weight: 600;

  opacity: 0.82;
}

#playlistName {
  margin-top: 7px;

  font-size: 16px;

  font-weight: 500;

  opacity: 0.55;
}

/* =========================
   PROGRESS
========================= */

#progressContainer {
  width: 100%;

  margin-top: 32px;
}

#progressBar {
  position: relative;

  width: 100%;
  height: 5px;

  border-radius: 999px;

  background:
    rgba(255,255,255,0.20);

  cursor: pointer;

  overflow: hidden;
}

#progress {
  width: 0%;
  height: 100%;

  border-radius: inherit;

  background: white;

  transition:
    width 0.15s linear;
}

#time {
  display: flex;
  align-items: center;
  justify-content: space-between;

  margin-top: 9px;

  font-size: 15px;

  font-weight: 500;

  opacity: 0.65;

  font-variant-numeric:
    tabular-nums;
}

/* =========================
   CONTROLS
========================= */

#controls {
  display: flex;
  align-items: center;
  justify-content: center;

  gap: 18px;

  margin-top: 24px;
}

.control {
  width: 48px;
  height: 48px;

  border: none;
  outline: none;

  border-radius: 50%;

  background:
    rgba(255,255,255,0.08);

  color: white;

  display: flex;
  align-items: center;
  justify-content: center;

  cursor: pointer;

  transition:
    background 0.2s ease,
    transform 0.2s ease;
}

.control:hover {
  background:
    rgba(255,255,255,0.16);

  transform:
    scale(1.06);
}

.control:active {
  transform:
    scale(0.95);
}

#playButton {
  width: 62px;
  height: 62px;

  background: white;

  color: black;
}

#playButton:hover {
  background: white;
  transform: scale(1.06);
}

/* =========================
   CSS ICONS
========================= */

.icon-play {
  width: 0;
  height: 0;

  border-top:
    9px solid transparent;

  border-bottom:
    9px solid transparent;

  border-left:
    14px solid currentColor;

  margin-left: 3px;
}

.icon-pause {
  width: 14px;
  height: 18px;

  border-left:
    5px solid currentColor;

  border-right:
    5px solid currentColor;
}

.icon-previous,
.icon-next {
  position: relative;

  width: 20px;
  height: 18px;
}

.icon-previous::before,
.icon-next::before {
  content: "";

  position: absolute;

  top: 3px;

  width: 0;
  height: 0;

  border-top:
    6px solid transparent;

  border-bottom:
    6px solid transparent;
}

.icon-previous::after,
.icon-next::after {
  content: "";

  position: absolute;

  top: 3px;

  width: 0;
  height: 0;

  border-top:
    6px solid transparent;

  border-bottom:
    6px solid transparent;
}

.icon-previous::before {
  left: 1px;

  border-right:
    9px solid currentColor;
}

.icon-previous::after {
  left: 8px;

  border-right:
    9px solid currentColor;
}

.icon-next::before {
  right: 8px;

  border-left:
    9px solid currentColor;
}

.icon-next::after {
  right: 1px;

  border-left:
    9px solid currentColor;
}

/* =========================
   VOLUME
========================= */

#volumeContainer {
  display: flex;
  align-items: center;
  justify-content: center;

  gap: 12px;

  margin-top: 20px;
}

#volumeIcon {
  width: 25px;
  height: 25px;

  display: flex;
  align-items: center;
  justify-content: center;

  cursor: pointer;

  opacity: 0.8;
}

#volumeSlider {
  width: min(220px, 30vw);

  appearance: none;

  height: 4px;

  border-radius: 999px;

  background:
    rgba(255,255,255,0.25);

  outline: none;
}

#volumeSlider::-webkit-slider-thumb {
  appearance: none;

  width: 13px;
  height: 13px;

  border-radius: 50%;

  background: white;

  cursor: pointer;
}

#volumeSlider::-moz-range-thumb {
  width: 13px;
  height: 13px;

  border: none;

  border-radius: 50%;

  background: white;

  cursor: pointer;
}

#volumePercentage {
  width: 38px;

  font-size: 12px;

  opacity: 0.65;

  font-variant-numeric:
    tabular-nums;
}

/* =========================
   CONNECT SCREEN
========================= */

#connectScreen {
  position: fixed;
  inset: 0;

  z-index: 20;

  display: flex;
  align-items: center;
  justify-content: center;

  background:
    #080808;
}

#connectBox {
  text-align: center;

  padding: 30px;
}

#connectBox h1 {
  margin: 0 0 12px;

  font-size: 42px;

  letter-spacing:
    -1.5px;
}

#connectBox p {
  margin: 0 0 25px;

  opacity: 0.6;
}

#connectButton {
  border: none;

  border-radius: 999px;

  padding:
    14px 25px;

  background: white;

  color: black;

  font-size: 15px;

  font-weight: 700;

  cursor: pointer;
}

/* =========================
   MOBILE PORTRAIT
========================= */

@media (max-width: 600px) {

  #content {
    padding:
      80px
      25px
      max(25px, env(safe-area-inset-bottom));
  }

  #header {
    left:
      max(18px, env(safe-area-inset-left));

    right:
      max(18px, env(safe-area-inset-right));
  }

  #logo {
    font-size: 18px;
  }

  #statusArea {
    gap: 6px;
  }

  #clock {
    font-size: 15px;
  }

  #deviceName {
    max-width: 110px;
    font-size: 10px;
  }

  #status {
    min-height: 27px;

    padding:
      6px
      10px;

    font-size: 9px;
  }

  #nowPlayingLayout {
    width: 100%;

    flex-direction: column;

    align-items: flex-start;
    justify-content: center;

    gap: 25px;

    overflow-y: auto;

    max-height: 100%;
  }

  #albumArtContainer {
    width: min(55vw, 280px);

    align-self: center;

    order: -1;

    border-radius: 18px;
  }

  #playing {
    width: 100%;
  }

  #trackName {
    font-size:
      clamp(34px, 10vw, 48px);

    letter-spacing:
      -1.3px;
  }

  #artistName {
    font-size: 18px;
  }

  #playlistName {
    font-size: 14px;
  }

  #progressContainer {
    margin-top: 24px;
  }

  #time {
    font-size: 14px;
  }

  #backgroundOverlay {
    background:
      linear-gradient(
        90deg,
        rgba(8,8,8,0.96) 0%,
        rgba(8,8,8,0.85) 35%,
        rgba(8,8,8,0.45) 70%,
        rgba(8,8,8,0.08) 100%
      );
  }
}

/* =========================
   LANDSCAPE
========================= */

@media
  (orientation: landscape)
  and (max-height: 600px) {

  #content {
    padding:
      65px
      7vw
      30px;
  }

  #header {
    top:
      max(12px, env(safe-area-inset-top));
  }

  #nowPlayingLayout {
    gap: 40px;
  }

  #playing {
    width:
      min(600px, 50vw);
  }

  #albumArtContainer {
    width:
      min(30vw, 280px);
  }

  #trackName {
    font-size:
      clamp(30px, 6vh, 48px);

    letter-spacing:
      -1.5px;
  }

  #artistName {
    font-size: 17px;

    margin-top: 8px;
  }

  #playlistName {
    font-size: 13px;

    margin-top: 5px;
  }

  #progressContainer {
    margin-top: 17px;
  }

  #controls {
    margin-top: 13px;
  }

  #volumeContainer {
    margin-top: 10px;
  }
}

/* =========================
   VERY SHORT LANDSCAPE
   iPHONE 13 LANDSCAPE
========================= */

@media
  (orientation: landscape)
  and (max-height: 430px) {

  #content {
    padding:
      45px
      7vw
      20px;
  }

  #nowPlayingLayout {
    gap: 25px;
  }

  #albumArtContainer {
    width:
      320px;
  }

  #trackName {
    font-size:
      clamp(25px, 6vh, 38px);
  }

  #artistName {
    font-size: 14px;
  }

  #playlistName {
    font-size: 11px;
  }

  #progressContainer {
    margin-top: 10px;
  }

  #controls {
    margin-top: 8px;
  }

  #volumeContainer {
    margin-top: 5px;
  }

  .control {
    width: 38px;
    height: 38px;
  }

  #playButton {
    width: 48px;
    height: 48px;
  }

  #clock {
    font-size: 14px;
  }
}
</style>
</head>

<script>

/* =========================
   SPOTIFY CONFIG
========================= */

const CLIENT_ID =
  "3f16de704ed44b8aac1ce33d94c4db45";

const REDIRECT_URI =
  "https://whatuwantsohai.github.io/SpotifyDisV1/";

const SCOPES = [
  "user-read-currently-playing",
  "user-read-playback-state",
  "user-modify-playback-state"
].join(" ");


/* =========================
   ELEMENTS
========================= */

const connectScreen =
  document.getElementById("connectScreen");

const connectButton =
  document.getElementById("connectButton");

const backgroundImage =
  document.getElementById("backgroundImage");

const albumArt =
  document.getElementById("albumArt");

const albumArtDisplay =
  document.getElementById("albumArtDisplay");

const trackName =
  document.getElementById("trackName");

const artistName =
  document.getElementById("artistName");

const playlistName =
  document.getElementById("playlistName");

const currentTime =
  document.getElementById("currentTime");

const duration =
  document.getElementById("duration");

const progress =
  document.getElementById("progress");

const progressBar =
  document.getElementById("progressBar");

const previousButton =
  document.getElementById("previousButton");

const playButton =
  document.getElementById("playButton");

const nextButton =
  document.getElementById("nextButton");

const volumeSlider =
  document.getElementById("volumeSlider");

const volumePercentage =
  document.getElementById("volumePercentage");

const volumeIcon =
  document.getElementById("volumeIcon");

const status =
  document.getElementById("status");

const deviceName =
  document.getElementById("deviceName");

const clock =
  document.getElementById("clock");


/* =========================
   PKCE
========================= */

function generateRandomString(length) {

  const characters =
    "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789";

  let result = "";

  for (let i = 0; i < length; i++) {

    result +=
      characters.charAt(
        Math.floor(
          Math.random() * characters.length
        )
      );

  }

  return result;
}


async function sha256(plain) {

  const encoder =
    new TextEncoder();

  const data =
    encoder.encode(plain);

  return window.crypto.subtle.digest(
    "SHA-256",
    data
  );
}


function base64encode(input) {

  return btoa(
    String.fromCharCode(
      ...new Uint8Array(input)
    )
  )
    .replace(/\+/g, "-")
    .replace(/\//g, "_")
    .replace(/=+$/, "");

}


async function generateCodeChallenge(verifier) {

  const hashed =
    await sha256(verifier);

  return base64encode(hashed);

}


/* =========================
   LOGIN
========================= */

async function login() {

  const verifier =
    generateRandomString(128);

  const challenge =
    await generateCodeChallenge(verifier);

  localStorage.setItem(
    "spotify_code_verifier",
    verifier
  );

  const params =
    new URLSearchParams({

      client_id:
        CLIENT_ID,

      response_type:
        "code",

      redirect_uri:
        REDIRECT_URI,

      code_challenge_method:
        "S256",

      code_challenge:
        challenge,

      scope:
        SCOPES

    });

  window.location.href =
    "https://accounts.spotify.com/authorize?" +
    params.toString();

}


/* =========================
   TOKEN
========================= */

async function exchangeCode(code) {

  const verifier =
    localStorage.getItem(
      "spotify_code_verifier"
    );

  const response =
    await fetch(
      "https://accounts.spotify.com/api/token",
      {

        method:
          "POST",

        headers: {
          "Content-Type":
            "application/x-www-form-urlencoded"
        },

        body:
          new URLSearchParams({

            client_id:
              CLIENT_ID,

            grant_type:
              "authorization_code",

            code:
              code,

            redirect_uri:
              REDIRECT_URI,

            code_verifier:
              verifier

          })

      }
    );

  const data =
    await response.json();

  if (data.access_token) {

    localStorage.setItem(
      "spotify_access_token",
      data.access_token
    );

    if (data.refresh_token) {

      localStorage.setItem(
        "spotify_refresh_token",
        data.refresh_token
      );

    }

    window.history.replaceState(
      {},
      document.title,
      REDIRECT_URI
    );

    startSpotify();

  }

}


async function refreshToken() {

  const refresh =
    localStorage.getItem(
      "spotify_refresh_token"
    );

  if (!refresh)
    return false;

  const response =
    await fetch(
      "https://accounts.spotify.com/api/token",
      {

        method:
          "POST",

        headers: {
          "Content-Type":
            "application/x-www-form-urlencoded"
        },

        body:
          new URLSearchParams({

            client_id:
              CLIENT_ID,

            grant_type:
              "refresh_token",

            refresh_token:
              refresh

          })

      }
    );

  const data =
    await response.json();

  if (data.access_token) {

    localStorage.setItem(
      "spotify_access_token",
      data.access_token
    );

    return true;

  }

  return false;

}


/* =========================
   API
========================= */

async function spotifyFetch(endpoint) {

  const token =
    localStorage.getItem(
      "spotify_access_token"
    );

  if (!token)
    return null;

  const response =
    await fetch(
      "https://api.spotify.com/v1" +
      endpoint,
      {

        headers: {
          Authorization:
            "Bearer " + token
        }

      }
    );

  if (response.status === 401) {

    const refreshed =
      await refreshToken();

    if (refreshed) {

      return spotifyFetch(
        endpoint
      );

    }

    logout();

    return null;

  }

  if (response.status === 204)
    return null;

  return response.json();

}


/* =========================
   PLAYLIST
========================= */

async function getPlaylistName(
  contextUri
) {

  if (!contextUri)
    return "";

  if (!contextUri.includes(
    "spotify:playlist:"
  ))
    return "";

  const playlistId =
    contextUri.split(
      "spotify:playlist:"
    )[1];

  if (!playlistId)
    return "";

  const data =
    await spotifyFetch(
      "/playlists/" +
      playlistId +
      "?fields=name"
    );

  return data?.name || "";

}


/* =========================
   TIME
========================= */

function formatTime(ms) {

  if (!ms ||
      ms < 0)
    ms = 0;

  const totalSeconds =
    Math.floor(
      ms / 1000
    );

  const minutes =
    Math.floor(
      totalSeconds / 60
    );

  const seconds =
    totalSeconds % 60;

  return (
    minutes +
    ":" +
    String(seconds).padStart(
      2,
      "0"
    )
  );

}


/* =========================
   CLOCK
========================= */

function updateClock() {

  const now =
    new Date();

  clock.textContent =
    now.toLocaleTimeString(
      [],
      {
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit",
        hour12: false
      }
    );

}

setInterval(
  updateClock,
  1000
);

updateClock();


/* =========================
   STATUS
========================= */

function updateStatus(
  isPlaying
) {

  status.classList.remove(
    "playing",
    "paused"
  );

  if (isPlaying) {

    status.textContent =
      "Playing";

    status.classList.add(
      "playing"
    );

  } else {

    status.textContent =
      "Paused";

    status.classList.add(
      "paused"
    );

  }

}


function updateStatusAndButton(
  isPlaying
) {

  updateStatus(
    isPlaying
  );

  updatePlayButton(
    isPlaying
  );

}


/* =========================
   PLAY BUTTON
========================= */

function updatePlayButton(
  isPlaying
) {

  if (isPlaying) {

    playButton.innerHTML =
      '<span class="icon-pause"></span>';

  } else {

    playButton.innerHTML =
      '<span class="icon-play"></span>';

  }

}


/* =========================
   CURRENT TRACK
========================= */

let currentTrackId =
  null;

let currentProgress =
  0;

let currentDuration =
  0;

let progressUpdatedAt =
  Date.now();

let progressTimer =
  null;


async function showPlaying(data) {

  if (!data ||
      !data.item) {

    trackName.textContent =
      "Nothing Playing";

    artistName.textContent =
      "—";

    playlistName.textContent =
      "No playlist";

    status.textContent =
      "Idle";

    status.classList.remove(
      "playing",
      "paused"
    );

    deviceName.textContent =
      "No device";

    return;

  }

  const track =
    data.item;

  const image =
    track.album?.images?.[0]?.url;

  const artists =
    track.artists
      ?.map(
        artist =>
          artist.name
      )
      .join(", ");

  trackName.textContent =
    track.name ||
    "Unknown Track";

  artistName.textContent =
    artists ||
    "Unknown Artist";

  currentProgress =
    data.progress_ms || 0;

  currentDuration =
    track.duration_ms || 0;

  progressUpdatedAt =
    Date.now();

  currentTime.textContent =
    formatTime(
      currentProgress
    );

  duration.textContent =
    formatTime(
      currentDuration
    );

  if (image) {

    albumArt.src =
      image;

    albumArtDisplay.src =
      image;

    backgroundImage.src =
      image;

    backgroundImage.style.opacity =
      "1";

    albumArtDisplay.style.opacity =
      "1";

  }

  const playlist =
    await getPlaylistName(
      data.context?.uri
    );

  playlistName.textContent =
    playlist ||
    "No playlist";

  deviceName.textContent =
    data.device?.name ||
    "No device";

  updateStatus(
    data.is_playing
  );

  updatePlayButton(
    data.is_playing
  );

  currentTrackId =
    track.id;

}


/* =========================
   PROGRESS TIMER
========================= */

function updateProgress() {

  if (!currentDuration)
    return;

  let elapsed =
    currentProgress;

  const isPlaying =
    status.classList.contains(
      "playing"
    );

  if (isPlaying) {

    elapsed +=
      Date.now() -
      progressUpdatedAt;

  }

  elapsed =
    Math.min(
      elapsed,
      currentDuration
    );

  currentTime.textContent =
    formatTime(
      elapsed
    );

  const percentage =
    (elapsed /
      currentDuration) *
    100;

  progress.style.width =
    percentage + "%";

}

progressTimer =
  setInterval(
    updateProgress,
    250
  );


/* =========================
   POLLING
========================= */

async function updatePlayer() {

  const data =
    await spotifyFetch(
      "/me/player"
    );

  if (data) {

    await showPlaying(
      data
    );

  }

}

let pollingInterval =
  null;


function startSpotify() {

  connectScreen.style.display =
    "none";

  updatePlayer();

  if (!pollingInterval) {

    pollingInterval =
      setInterval(
        updatePlayer,
        5000
      );

  }

}


/* =========================
   CONTROLS
========================= */

previousButton.addEventListener(
  "click",
  async () => {

    await spotifyFetch(
      "/me/player/previous",
      {
        method: "POST"
      }
    );

    setTimeout(
      updatePlayer,
      400
    );

  }
);


playButton.addEventListener(
  "click",
  async () => {

    const isPlaying =
      status.classList.contains(
        "playing"
      );

    await spotifyFetch(
      isPlaying
        ? "/me/player/pause"
        : "/me/player/play",
      {
        method: "PUT"
      }
    );

    setTimeout(
      updatePlayer,
      300
    );

  }
);


nextButton.addEventListener(
  "click",
  async () => {

    await spotifyFetch(
      "/me/player/next",
      {
        method: "POST"
      }
    );

    setTimeout(
      updatePlayer,
      400
    );

  }
);


/* =========================
   SEEK
========================= */

progressBar.addEventListener(
  "click",
  async event => {

    if (!currentDuration)
      return;

    const rect =
      progressBar.getBoundingClientRect();

    const percentage =
      (
        event.clientX -
        rect.left
      ) /
      rect.width;

    const position =
      Math.max(
        0,
        Math.min(
          1,
          percentage
        )
      ) *
      currentDuration;

    await spotifyFetch(
      "/me/player/seek?position_ms=" +
      Math.floor(position),
      {
        method: "PUT"
      }
    );

    currentProgress =
      position;

    progressUpdatedAt =
      Date.now();

    updateProgress();

  }
);


/* =========================
   VOLUME
========================= */

let lastVolume =
  100;


volumeSlider.addEventListener(
  "input",
  async () => {

    const volume =
      Number(
        volumeSlider.value
      );

    volumePercentage.textContent =
      volume + "%";

    lastVolume =
      volume;

    await spotifyFetch(
      "/me/player/volume?volume_percent=" +
      volume,
      {
        method: "PUT"
      }
    );

  }
);


volumeIcon.addEventListener(
  "click",
  async () => {

    const current =
      Number(
        volumeSlider.value
      );

    if (current > 0) {

      lastVolume =
        current;

      volumeSlider.value =
        0;

      volumePercentage.textContent =
        "0%";

      await spotifyFetch(
        "/me/player/volume?volume_percent=0",
        {
          method: "PUT"
        }
      );

    } else {

      const restored =
        lastVolume || 100;

      volumeSlider.value =
        restored;

      volumePercentage.textContent =
        restored + "%";

      await spotifyFetch(
        "/me/player/volume?volume_percent=" +
        restored,
        {
          method: "PUT"
        }
      );

    }

  }
);


/* =========================
   LOGOUT
========================= */

function logout() {

  localStorage.removeItem(
    "spotify_access_token"
  );

  localStorage.removeItem(
    "spotify_refresh_token"
  );

  connectScreen.style.display =
    "flex";

  status.textContent =
    "Offline";

  status.classList.remove(
    "playing",
    "paused"
  );

}


/* =========================
   AUTH CALLBACK
========================= */

async function handleCallback() {

  const params =
    new URLSearchParams(
      window.location.search
    );

  const code =
    params.get("code");

  if (code) {

    await exchangeCode(
      code
    );

    return true;

  }

  return false;

}


/* =========================
   START
========================= */

connectButton.addEventListener(
  "click",
  login
);


(async () => {

  const callback =
    await handleCallback();

  if (callback)
    return;

  const token =
    localStorage.getItem(
      "spotify_access_token"
    );

  if (token) {

    startSpotify();

  } else {

    connectScreen.style.display =
      "flex";

  }

})();

</script>
