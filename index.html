<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>SpotDeck</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #080808;
      color: white;
      min-height: 100vh;
      overflow: hidden;
    }

    /* =========================
       CONNECT SCREEN
    ========================= */

    #connectScreen {
      position: fixed;
      inset: 0;
      background: #080808;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 99999;
    }

    #connectBox {
      width: min(90%, 420px);
      text-align: center;
      padding: 40px 30px;
      border-radius: 24px;
      background: #151515;
      border: 1px solid #292929;
      box-shadow: 0 25px 80px rgba(0,0,0,0.6);
    }

    #connectBox h1 {
      font-size: 42px;
      margin-bottom: 10px;
      letter-spacing: -2px;
    }

    #connectBox p {
      color: #aaa;
      margin-bottom: 30px;
      line-height: 1.5;
    }

    #connectButton {
      position: relative;
      z-index: 100000;

      display: inline-flex;
      align-items: center;
      justify-content: center;

      width: 100%;
      min-height: 58px;

      border: none;
      border-radius: 999px;

      background: #1ed760;
      color: #000;

      font-size: 17px;
      font-weight: bold;

      cursor: pointer;

      box-shadow: 0 10px 35px rgba(30,215,96,0.25);

      transition:
        transform 0.15s ease,
        background 0.15s ease,
        box-shadow 0.15s ease;
    }

    #connectButton:hover {
      background: #1fdf64;
      transform: translateY(-2px);
      box-shadow: 0 15px 45px rgba(30,215,96,0.35);
    }

    #connectButton:active {
      transform: scale(0.98);
    }

    /* =========================
       MAIN APP
    ========================= */

    #app {
      display: none;
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #080808;
    }

    #background {
      position: absolute;
      inset: 0;

      background-size: cover;
      background-position: center;

      filter: blur(35px);
      transform: scale(1.12);

      opacity: 0.35;

      transition:
        background-image 0.8s ease,
        opacity 0.5s ease;
    }

    #backgroundOverlay {
      position: absolute;
      inset: 0;
      background:
        linear-gradient(
          180deg,
          rgba(0,0,0,0.55),
          rgba(0,0,0,0.8)
        );
    }

    #content {
      position: relative;
      z-index: 5;

      width: 100%;
      height: 100%;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      padding: 30px;
    }

    /* =========================
       HEADER
    ========================= */

    #header {
      position: absolute;
      top: 25px;
      left: 30px;
      right: 30px;

      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    #logo {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -1px;
    }

    #status {
      color: #aaa;
      font-size: 13px;
    }

    /* =========================
       ALBUM
    ========================= */

    #albumArt {
      width: min(55vh, 420px);
      height: min(55vh, 420px);

      object-fit: cover;

      border-radius: 18px;

      background: #151515;

      box-shadow:
        0 30px 90px rgba(0,0,0,0.55);

      transition:
        transform 0.4s ease,
        opacity 0.4s ease;
    }

    #albumArt:hover {
      transform: scale(1.015);
    }

    /* =========================
       TRACK INFO
    ========================= */

    #trackInfo {
      width: min(90%, 600px);
      margin-top: 28px;
      text-align: center;
    }

    #trackName {
      font-size: clamp(25px, 4vw, 40px);
      font-weight: 800;

      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    #artistName {
      margin-top: 8px;

      color: #bdbdbd;

      font-size: clamp(15px, 2vw, 19px);

      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* =========================
       PROGRESS
    ========================= */

    #progressContainer {
      width: min(90%, 600px);
      margin-top: 25px;
    }

    #progressBar {
      width: 100%;
      height: 5px;

      background: rgba(255,255,255,0.18);

      border-radius: 999px;

      overflow: hidden;

      cursor: pointer;
    }

    #progress {
      width: 0%;
      height: 100%;

      background: white;

      border-radius: 999px;

      transition: width 0.3s linear;
    }

    #time {
      display: flex;
      justify-content: space-between;

      margin-top: 8px;

      font-size: 11px;
      color: #aaa;
    }

    /* =========================
       CONTROLS
    ========================= */

    #controls {
      display: flex;
      align-items: center;
      justify-content: center;

      gap: 22px;

      margin-top: 25px;
    }

    .control {
      width: 45px;
      height: 45px;

      border: none;
      border-radius: 50%;

      background: rgba(255,255,255,0.08);

      color: white;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 18px;

      cursor: pointer;

      transition:
        background 0.15s ease,
        transform 0.15s ease;
    }

    .control:hover {
      background: rgba(255,255,255,0.18);
      transform: scale(1.05);
    }

    #playButton {
      width: 58px;
      height: 58px;

      background: white;
      color: black;

      font-size: 22px;
    }

    #playButton:hover {
      background: #eee;
    }

    /* =========================
       DISCONNECTED
    ========================= */

    #nothingPlaying {
      display: none;

      text-align: center;
    }

    #nothingPlaying h2 {
      font-size: 30px;
      margin-bottom: 8px;
    }

    #nothingPlaying p {
      color: #aaa;
    }

    /* =========================
       RESPONSIVE
    ========================= */

    @media (max-width: 600px) {

      #content {
        padding: 20px;
      }

      #header {
        top: 18px;
        left: 20px;
        right: 20px;
      }

      #albumArt {
        width: min(78vw, 360px);
        height: min(78vw, 360px);
      }

      #controls {
        gap: 12px;
      }

      .control {
        width: 40px;
        height: 40px;
      }

      #playButton {
        width: 52px;
        height: 52px;
      }
    }
  </style>
</head>

<body>

  <!-- =========================
       CONNECT SCREEN
  ========================= -->

  <div id="connectScreen">

    <div id="connectBox">

      <h1>SpotDeck</h1>

      <p>
        Connect your Spotify account to display
        your currently playing music.
      </p>

      <button id="connectButton" type="button">
        Connect Spotify
      </button>

    </div>

  </div>


  <!-- =========================
       MAIN APP
  ========================= -->

  <div id="app">

    <div id="background"></div>

    <div id="backgroundOverlay"></div>

    <div id="content">

      <div id="header">
        <div id="logo">SPOTDECK</div>
        <div id="status">Connected</div>
      </div>


      <!-- PLAYING -->

      <div id="playing">

        <img
          id="albumArt"
          src=""
          alt="Album artwork"
        >

        <div id="trackInfo">

          <div id="trackName">
            Nothing Playing
          </div>

          <div id="artistName">
            —
          </div>

        </div>


        <div id="progressContainer">

          <div id="progressBar">
            <div id="progress"></div>
          </div>

          <div id="time">

            <span id="currentTime">
              0:00
            </span>

            <span id="duration">
              0:00
            </span>

          </div>

        </div>


        <div id="controls">

          <button
            class="control"
            id="previousButton"
            type="button"
            title="Previous"
          >
            ⏮
          </button>

          <button
            class="control"
            id="playButton"
            type="button"
            title="Play / Pause"
          >
            ▶
          </button>

          <button
            class="control"
            id="nextButton"
            type="button"
            title="Next"
          >
            ⏭
          </button>

        </div>

      </div>


      <!-- NOTHING PLAYING -->

      <div id="nothingPlaying">

        <h2>Nothing Playing</h2>

        <p>
          Start playing something on Spotify.
        </p>

      </div>

    </div>

  </div>


  <script>

    /* =====================================================
       SPOTIFY CONFIG
    ===================================================== */

    const SPOTIFY_CLIENT_ID =
      "3f16de704ed44b8aac1ce33d94c4db45";

    const REDIRECT_URI =
      "https://whatuwantsohai.github.io/SpotifyDisV1/";


    const SCOPES = [
      "user-read-currently-playing",
      "user-read-playback-state",
      "user-modify-playback-state",
      "user-read-private",
      "user-read-email"
    ].join(" ");


    /* =====================================================
       ELEMENTS
    ===================================================== */

    const connectScreen =
      document.getElementById("connectScreen");

    const connectButton =
      document.getElementById("connectButton");

    const app =
      document.getElementById("app");

    const albumArt =
      document.getElementById("albumArt");

    const background =
      document.getElementById("background");

    const trackName =
      document.getElementById("trackName");

    const artistName =
      document.getElementById("artistName");

    const progress =
      document.getElementById("progress");

    const currentTime =
      document.getElementById("currentTime");

    const duration =
      document.getElementById("duration");

    const playButton =
      document.getElementById("playButton");

    const previousButton =
      document.getElementById("previousButton");

    const nextButton =
      document.getElementById("nextButton");

    const playing =
      document.getElementById("playing");

    const nothingPlaying =
      document.getElementById("nothingPlaying");

    const status =
      document.getElementById("status");


    /* =====================================================
       PKCE HELPERS
    ===================================================== */

    function generateRandomString(length) {

      const characters =
        "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789";

      let result = "";

      const randomValues =
        crypto.getRandomValues(
          new Uint8Array(length)
        );

      for (let i = 0; i < length; i++) {

        result +=
          characters[
            randomValues[i] % characters.length
          ];

      }

      return result;
    }


    async function sha256(plain) {

      const encoder =
        new TextEncoder();

      const data =
        encoder.encode(plain);

      return window.crypto.subtle.digest(
        "SHA-256",
        data
      );
    }


    function base64UrlEncode(input) {

      return btoa(
        String.fromCharCode(...new Uint8Array(input))
      )
      .replace(/\+/g, "-")
      .replace(/\//g, "_")
      .replace(/=+$/, "");

    }


    async function createCodeChallenge(verifier) {

      const hashed =
        await sha256(verifier);

      return base64UrlEncode(hashed);

    }


    /* =====================================================
       LOGIN
    ===================================================== */

    async function login() {

      try {

        const verifier =
          generateRandomString(64);

        const challenge =
          await createCodeChallenge(verifier);

        sessionStorage.setItem(
          "spotify_code_verifier",
          verifier
        );


        const params =
          new URLSearchParams({

            client_id:
              SPOTIFY_CLIENT_ID,

            response_type:
              "code",

            redirect_uri:
              REDIRECT_URI,

            code_challenge_method:
              "S256",

            code_challenge:
              challenge,

            scope:
              SCOPES

          });


        window.location.href =
          "https://accounts.spotify.com/authorize?" +
          params.toString();

      }

      catch (error) {

        console.error(
          "Login error:",
          error
        );

        alert(
          "Unable to start Spotify login."
        );

      }

    }


    /* =====================================================
       TOKEN EXCHANGE
    ===================================================== */

    async function exchangeCodeForToken(code) {

      const verifier =
        sessionStorage.getItem(
          "spotify_code_verifier"
        );

      if (!verifier) {

        throw new Error(
          "Missing PKCE verifier."
        );

      }


      const body =
        new URLSearchParams({

          client_id:
            SPOTIFY_CLIENT_ID,

          grant_type:
            "authorization_code",

          code:
            code,

          redirect_uri:
            REDIRECT_URI,

          code_verifier:
            verifier

        });


      const response =
        await fetch(
          "https://accounts.spotify.com/api/token",
          {
            method: "POST",

            headers: {
              "Content-Type":
                "application/x-www-form-urlencoded"
            },

            body: body.toString()
          }
        );


      const data =
        await response.json();


      if (!response.ok) {

        console.error(
          "Token error:",
          data
        );

        throw new Error(
          data.error_description ||
          "Token exchange failed."
        );

      }


      localStorage.setItem(
        "spotify_access_token",
        data.access_token
      );


      if (data.refresh_token) {

        localStorage.setItem(
          "spotify_refresh_token",
          data.refresh_token
        );

      }


      const expiresAt =
        Date.now() +
        (data.expires_in * 1000);

      localStorage.setItem(
        "spotify_token_expires",
        expiresAt.toString()
      );


      sessionStorage.removeItem(
        "spotify_code_verifier"
      );


      return data.access_token;

    }


    /* =====================================================
       REFRESH TOKEN
    ===================================================== */

    async function refreshToken() {

      const refresh =
        localStorage.getItem(
          "spotify_refresh_token"
        );

      if (!refresh) {

        return false;

      }


      const body =
        new URLSearchParams({

          client_id:
            SPOTIFY_CLIENT_ID,

          grant_type:
            "refresh_token",

          refresh_token:
            refresh

        });


      const response =
        await fetch(
          "https://accounts.spotify.com/api/token",
          {
            method: "POST",

            headers: {
              "Content-Type":
                "application/x-www-form-urlencoded"
            },

            body: body.toString()
          }
        );


      if (!response.ok) {

        return false;

      }


      const data =
        await response.json();


      localStorage.setItem(
        "spotify_access_token",
        data.access_token
      );


      if (data.refresh_token) {

        localStorage.setItem(
          "spotify_refresh_token",
          data.refresh_token
        );

      }


      const expiresAt =
        Date.now() +
        (data.expires_in * 1000);

      localStorage.setItem(
        "spotify_token_expires",
        expiresAt.toString()
      );


      return true;

    }


    /* =====================================================
       GET TOKEN
    ===================================================== */

    async function getAccessToken() {

      let token =
        localStorage.getItem(
          "spotify_access_token"
        );

      const expires =
        Number(
          localStorage.getItem(
            "spotify_token_expires"
          ) || 0
        );


      if (
        !token ||
        Date.now() > expires - 60000
      ) {

        const refreshed =
          await refreshToken();


        if (refreshed) {

          token =
            localStorage.getItem(
              "spotify_access_token"
            );

        }

      }


      return token;

    }


    /* =====================================================
       SPOTIFY API
    ===================================================== */

    async function spotifyFetch(
      endpoint,
      options = {}
    ) {

      let token =
        await getAccessToken();


      if (!token) {

        throw new Error(
          "Not authenticated."
        );

      }


      options.headers = {

        ...(options.headers || {}),

        Authorization:
          "Bearer " + token

      };


      let response =
        await fetch(
          "https://api.spotify.com/v1" +
          endpoint,
          options
        );


      if (response.status === 401) {

        const refreshed =
          await refreshToken();


        if (!refreshed) {

          logout();

          throw new Error(
            "Spotify session expired."
          );

        }


        token =
          localStorage.getItem(
            "spotify_access_token"
          );


        options.headers.Authorization =
          "Bearer " + token;


        response =
          await fetch(
            "https://api.spotify.com/v1" +
            endpoint,
            options
          );

      }


      return response;

    }


    /* =====================================================
       GET CURRENT SONG
    ===================================================== */

    async function getCurrentTrack() {

      try {

        const response =
          await spotifyFetch(
            "/me/player"
          );


        if (response.status === 204) {

          showNothingPlaying();

          return;

        }


        if (!response.ok) {

          console.error(
            "Playback request failed:",
            response.status
          );

          return;

        }


        const data =
          await response.json();


        if (
          !data ||
          !data.item
        ) {

          showNothingPlaying();

          return;

        }


        showPlaying(data);

      }

      catch (error) {

        console.error(
          "Playback error:",
          error
        );

      }

    }


    /* =====================================================
       DISPLAY SONG
    ===================================================== */

    function showPlaying(data) {

      playing.style.display =
        "flex";

      playing.style.flexDirection =
        "column";

      playing.style.alignItems =
        "center";


      nothingPlaying.style.display =
        "none";


      const track =
        data.item;


      trackName.textContent =
        track.name;


      artistName.textContent =
        track.artists
          .map(
            artist => artist.name
          )
          .join(", ");


      const image =
        track.album &&
        track.album.images &&
        track.album.images.length
          ? track.album.images[0].url
          : "";


      if (image) {

        albumArt.src =
          image;

        background.style.backgroundImage =
          `url("${image}")`;

      }


      const trackDuration =
        track.duration_ms || 0;

      const trackProgress =
        data.progress_ms || 0;


      duration.textContent =
        formatTime(trackDuration);


      currentTime.textContent =
        formatTime(trackProgress);


      const percentage =
        trackDuration
          ? (trackProgress / trackDuration) * 100
          : 0;


      progress.style.width =
        Math.min(
          percentage,
          100
        ) + "%";


      playButton.textContent =
        data.is_playing
          ? "⏸"
          : "▶";


      status.textContent =
        data.is_playing
          ? "Playing"
          : "Paused";

    }


    function showNothingPlaying() {

      playing.style.display =
        "none";

      nothingPlaying.style.display =
        "block";

      status.textContent =
        "Nothing playing";

    }


    /* =====================================================
       TIME FORMAT
    ===================================================== */

    function formatTime(ms) {

      const totalSeconds =
        Math.floor(ms / 1000);

      const minutes =
        Math.floor(
          totalSeconds / 60
        );

      const seconds =
        totalSeconds % 60;


      return (
        minutes +
        ":" +
        seconds
          .toString()
          .padStart(2, "0")
      );

    }


    /* =====================================================
       PLAY / PAUSE
    ===================================================== */

    async function togglePlay() {

      try {

        const response =
          await spotifyFetch(
            "/me/player"
          );


        if (response.status === 204) {

          return;

        }


        const data =
          await response.json();


        if (data.is_playing) {

          await spotifyFetch(
            "/me/player/pause",
            {
              method: "PUT"
            }
          );

        }

        else {

          await spotifyFetch(
            "/me/player/play",
            {
              method: "PUT"
            }
          );

        }


        setTimeout(
          getCurrentTrack,
          300
        );

      }

      catch (error) {

        console.error(
          "Play/pause error:",
          error
        );

      }

    }


    /* =====================================================
       NEXT
    ===================================================== */

    async function nextTrack() {

      try {

        await spotifyFetch(
          "/me/player/next",
          {
            method: "POST"
          }
        );


        setTimeout(
          getCurrentTrack,
          500
        );

      }

      catch (error) {

        console.error(
          "Next track error:",
          error
        );

      }

    }


    /* =====================================================
       PREVIOUS
    ===================================================== */

    async function previousTrack() {

      try {

        await spotifyFetch(
          "/me/player/previous",
          {
            method: "POST"
          }
        );


        setTimeout(
          getCurrentTrack,
          500
        );

      }

      catch (error) {

        console.error(
          "Previous track error:",
          error
        );

      }

    }


    /* =====================================================
       SEEK
    ===================================================== */

    async function seek(event) {

      try {

        const rect =
          document
            .getElementById("progressBar")
            .getBoundingClientRect();


        const percentage =
          (event.clientX - rect.left) /
          rect.width;


        const response =
          await spotifyFetch(
            "/me/player"
          );


        if (response.status === 204) {

          return;

        }


        const data =
          await response.json();


        const durationMs =
          data.item.duration_ms;


        const position =
          Math.floor(
            percentage *
            durationMs
          );


        await spotifyFetch(
          "/me/player/seek?position_ms=" +
          position,
          {
            method: "PUT"
          }
        );


        setTimeout(
          getCurrentTrack,
          300
        );

      }

      catch (error) {

        console.error(
          "Seek error:",
          error
        );

      }

    }


    /* =====================================================
       LOGOUT
    ===================================================== */

    function logout() {

      localStorage.removeItem(
        "spotify_access_token"
      );

      localStorage.removeItem(
        "spotify_refresh_token"
      );

      localStorage.removeItem(
        "spotify_token_expires"
      );


      app.style.display =
        "none";

      connectScreen.style.display =
        "flex";

    }


    /* =====================================================
       AUTH CALLBACK
    ===================================================== */

    async function handleCallback() {

      const params =
        new URLSearchParams(
          window.location.search
        );


      const code =
        params.get("code");


      const error =
        params.get("error");


      if (error) {

        console.error(
          "Spotify authorization error:",
          error
        );

        return;

      }


      if (!code) {

        return;

      }


      try {

        await exchangeCodeForToken(
          code
        );


        window.history.replaceState(
          {},
          document.title,
          REDIRECT_URI
        );


        openApp();

      }

      catch (error) {

        console.error(
          "Authentication failed:",
          error
        );

        alert(
          "Spotify authentication failed. Check the browser console for details."
        );

      }

    }


    /* =====================================================
       OPEN APP
    ===================================================== */

    async function openApp() {

      const token =
        await getAccessToken();


      if (!token) {

        connectScreen.style.display =
          "flex";

        app.style.display =
          "none";

        return;

      }


      connectScreen.style.display =
        "none";

      app.style.display =
        "block";


      await getCurrentTrack();

    }


    /* =====================================================
       BUTTON EVENTS
    ===================================================== */

    connectButton.addEventListener(
      "click",
      login
    );


    playButton.addEventListener(
      "click",
      togglePlay
    );


    nextButton.addEventListener(
      "click",
      nextTrack
    );


    previousButton.addEventListener(
      "click",
      previousTrack
    );


    document
      .getElementById("progressBar")
      .addEventListener(
        "click",
        seek
      );


    /* =====================================================
       INITIALIZE
    ===================================================== */

    (async function init() {

      await handleCallback();


      const token =
        await getAccessToken();


      if (token) {

        openApp();

      }

    })();


    /* =====================================================
       REFRESH PLAYBACK
    ===================================================== */

    setInterval(
      async () => {

        const token =
          localStorage.getItem(
            "spotify_access_token"
          );


        if (token) {

          await getCurrentTrack();

        }

      },
      5000
    );

  </script>
